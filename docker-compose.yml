version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: catcanteen-db
    environment:
      POSTGRES_USER: catcanteen
      POSTGRES_PASSWORD: catcanteen_dev_password
      POSTGRES_DB: catcanteen
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catcanteen"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catcanteen-network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: catcanteen-backend
    environment:
      - DATABASE_URL=postgresql://catcanteen:catcanteen_dev_password@db:5432/catcanteen
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - catcanteen-network

  # Frontend (React + Vite dev server)
  frontend:
    image: node:20-slim
    container_name: catcanteen-frontend
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume to prevent node_modules from being overwritten
    ports:
      - "5173:5173"
    command: sh -c "npm install -g pnpm@8.15.0 && pnpm install && pnpm dev --host 0.0.0.0"
    depends_on:
      - backend
    networks:
      - catcanteen-network

volumes:
  postgres_data:
    driver: local

networks:
  catcanteen-network:
    driver: bridge
